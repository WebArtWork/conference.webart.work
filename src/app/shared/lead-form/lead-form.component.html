@switch (status()) {
	@case ('success') {
		<div class="lead-form lead-form--success">
			<p>{{ translateService.translate("Thank you! We've received your message and will be in touch soon.")() }}</p>
		</div>
	}
	@default {
		<form class="lead-form" novalidate #leadForm="ngForm" (ngSubmit)="submit(leadForm)">
			<div class="lead-form__field">
				<label>{{ translateService.translate('Name')() }}</label>
				<input #nameInput pInputText type="text" name="name" required [ngModel]="name()" (ngModelChange)="name.set($event)" />
			</div>
			<div class="lead-form__field">
				<label>{{ translateService.translate('Email or phone')() }}</label>
				<input pInputText type="text" name="contact" required [ngModel]="contact()" (ngModelChange)="contact.set($event)" />
			</div>
			<div class="lead-form__field">
				<label>{{ translateService.translate('Message')() }}</label>
				<textarea pTextarea rows="3" name="message" [ngModel]="message()" (ngModelChange)="message.set($event)"></textarea>
			</div>
			@if (status() === 'error') {
				<p class="lead-form__error">
					{{ translateService.translate('Something went wrong — please try again.')() }}
					<button type="button" class="lead-form__retry" (click)="retry()">{{ translateService.translate('Try again')() }}</button>
				</p>
			}
			<button pButton type="submit" [disabled]="leadForm.invalid || status() === 'sending'">
				{{ submitLabel() || translateService.translate('Send')() }}
			</button>
		</form>
	}
}
